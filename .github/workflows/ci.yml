name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o stowage ./cmd/stowage/

      - name: Run tests
        run: go test -v ./cmd/stowage
